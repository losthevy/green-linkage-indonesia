options:{indexAxis:'y',scales:{x:{...xVal('Tonase (ton)'),stacked:true,ticks:{callback:v=>fmt(v,0)}},y:{...yCat(),stacked:true}},plugins:{legend:{position:'top',align:'end'},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.x,0)} ton`}}}}}}
const nrows=()=>R.map(r=>({r,i:ismOf(r),s:rst(r)})).sort((a,b)=>b.i-a.i);
const ic=i=>css(i>1?'--rd':i>.85?'--am':'--g2');
function ismCfg(rows){return{type:'bar',data:{labels:rows.map(x=>x.r.n),datasets:[{label:'ISM',data:rows.map(x=>+x.i.toFixed(3)),backgroundColor:rows.map(x=>ic(x.i)),borderRadius:7,borderSkipped:false,maxBarThickness:20}]},
options:{indexAxis:'y',scales:{x:xVal('Indeks Surplus Mustahil',{min:0,suggestedMax:scl(),ticks:{callback:v=>fmt(v,1)}}),y:yCat()},plugins:{legend:{display:false},thr:{v:1,c:css('--ink'),l:'Ambang 1'},tooltip:{callbacks:{label:c=>` ISM ${fmt(c.parsed.x)}`,afterLabel:c=>{const x=rows[c.dataIndex];return x.i>1?' Mustahil seluruhnya limbah':x.i>.85?' Waspada':' Wajar'}}}}},plugins:[THR]}}
function kpCfg(rows){return{type:'bar',data:{labels:rows.map(x=>x.r.n),datasets:[{label:'Potensi limbah',data:rows.map(x=>x.r.pot),backgroundColor:hexA(css('--g2'),.25),borderColor:css('--g2'),borderWidth:1.5,borderRadius:6,maxBarThickness:26},{label:'Klaim',data:rows.map(x=>Math.round(scen=='live'?klaim(x.r.id):x.i*x.r.pot)),backgroundColor:rows.map(x=>ic(x.i)),borderRadius:6,maxBarThickness:26}]},
options:{scales:{y:xVal('ton/bulan',{beginAtZero:true,ticks:{callback:v=>fmt(v,0)}}),x:{grid:{display:false},border:{display:false},ticks:{color:css('--ink'),maxRotation:40,autoSkip:false}}},plugins:{legend:{position:'top',align:'end'},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y,0)} ton/bulan`}}}}}}
function rngCfg(){const e=Object.values(SC);return{type:'bar',data:{labels:e.map(c=>c[0]),datasets:[{label:'Rentang ISM',data:e.map(c=>[c[1],c[2]]),backgroundColor:e.map(c=>css(c[1]>1?'--rd':c[2]>1?'--am':'--g2')),borderRadius:10,borderSkipped:false,maxBarThickness:24}]},
options:{indexAxis:'y',scales:{x:xVal('ISM',{min:0,max:4.5,ticks:{callback:v=>fmt(v,1)}}),y:yCat()},plugins:{legend:{display:false},thr:{v:1,c:css('--ink'),l:'Ambang 1'},tooltip:{callbacks:{label:c=>` ${fmt(c.raw[0])} sampai ${fmt(c.raw[1])}`}}}},plugins:[THR]}}
function trendCfg(){const p=[],lb=[];let g=0,a=0;S.ships.forEach(s=>{a+=s.w;if(eff(s)=='hijau')g+=s.w;p.push(+(g/a*100).toFixed(1));lb.push(s.id)});const G=css('--g2');
return{type:'line',data:{labels:lb,datasets:[{label:'Rasio Limbah Terbukti',data:p,borderColor:G,borderWidth:2.5,tension:.35,pointRadius:3.5,pointHoverRadius:7,pointBackgroundColor:css('--sf'),pointBorderColor:G,pointBorderWidth:2,fill:true,backgroundColor:c=>{const {ctx,chartArea:ca}=c.chart;if(!ca)return'transparent';const gr=ctx.createLinearGradient(0,ca.top,0,ca.bottom);gr.addColorStop(0,hexA(G,.32));gr.addColorStop(1,hexA(G,0));return gr}},{label:'Nilai dasar',data:lb.map(()=>+S.base.toFixed(1)),borderColor:css('--mut'),borderDash:[6,5],borderWidth:1.5,pointRadius:0,pointHoverRadius:0,fill:false}]},
options:{interaction:{mode:'index',intersect:false},scales:{y:xVal('',{min:0,max:100,ticks:{callback:v=>v+'%',stepSize:25}}),x:{grid:{display:false},border:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8}}},plugins:{legend:{position:'top',align:'end'},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y,1)}%`}}}}}}
function donutCfg(t){return{type:'doughnut',data:{labels:['Hijau','Kuning','Merah'],datasets:[{data:[t.hijau,t.kuning,t.merah],backgroundColor:[css('--g2'),css('--am'),css('--rd')],borderColor:css('--sf'),borderWidth:3,hoverOffset:6,borderRadius:4}]},options:{cutout:'74%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt(c.parsed,0)} ton (${fmt(c.parsed/(t.all||1)*100,1)}%)`}}}}}}
function funnelCfg(st){const g=css('--g2');return{type:'bar',data:{labels:st.map(x=>x[0]),datasets:[{data:st.map(x=>x[1]),backgroundColor:st.map((x,i)=>hexA(g,1-i*.16)),borderRadius:7,borderSkipped:false,maxBarThickness:22}]},options:{indexAxis:'y',scales:{x:xVal('Jumlah kiriman',{beginAtZero:true,ticks:{precision:0}}),y:yCat()},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.x} kiriman`}}}}}}
function ctxCfg(){return{type:'bar',data:{labels:['Pemakaian 2023','Target PLN 2025'],datasets:[{data:[.991,10],backgroundColor:[css('--g2'),css('--am')],borderRadius:8,borderSkipped:false,maxBarThickness:26}]},options:{indexAxis:'y',scales:{x:xVal('Juta ton biomassa',{beginAtZero:true,ticks:{callback:v=>fmt(v,0)}}),y:yCat()},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fmt(c.parsed.x,c.parsed.x<1?3:0)} juta ton`}}}}}}
const ctx=id=>`<div class="card"><div class="ch"><h3>Permintaan melaju, pasokan limbah tidak</h3></div>${cv(id,140)}<div class="callout"><b>30,7%</b><span class="mut">porsi limbah yang tersedia untuk co-firing. Selebihnya harus dicari dari sumber lain, dan di situlah risiko kayu hutan masuk.</span></div><p class="mut" style="margin:8px 0 0">Sumber: Kementerian ESDM (2024), Antara (2024), Squire et al. (2024).</p></div>`;

return`<section class="hero"><div><span class="eyebrow">Ketertelusuran biomassa co-firing PLTU</span><h1>Dari mana asal tiap ton biomassa?</h1><p class="mut">Setiap kiriman diuji terhadap potensi limbah kabupaten asalnya dan peringatan kehilangan tutupan hutan. Pin menunjukkan Indeks Surplus Mustahil (ISM): di atas 1, tonase tidak mungkin seluruhnya limbah.</p></div></section>
<div class="kpi">${kpi('inbox',S.ships.length,'kiriman diperiksa')}${kpi('leaf',fmt(t.rl,1)+'%','Rasio Limbah Terbukti','g2')}${kpi('alert',bad+' dari '+R.length,'kabupaten melewati ambang','am')}${kpi('flag',reds,'berkas merah','rd')}</div>

<div class="ch" style="margin-top:6px"><h2>Tiga modul, satu tujuan</h2></div><div class="grid">
${[['pin','Asal','Merekam identitas dan titik asal tiap kiriman','kirim'],['scale','Neraca','Mengadu klaim dengan potensi limbah wilayah','neraca'],['shield','Gerbang','Hijau, kuning, merah untuk setiap kiriman','dash'],['eye','Verifikator Muda','Memeriksa titik asal kiriman meragukan','ver']].map(a=>`<button class="tile" onclick="${RL[ROLE][3].includes(a[3])?`go('${a[3]}')`:`toast('Ganti peran untuk membuka modul ini')`}"><span class="ti">${I(a[0],22)}</span><b>${a[1]}</b><span class="mut">${a[2]}</span></button>`).join('')}</div>

<div class="card"><div class="ch"><h3>Peta jalan</h3></div><div class="tl">${[['2027','Uji coba di PLTU Ampana dan PLTU Ombilin'],['2028','ISM terhitung di semua kabupaten pemasok, Rasio Limbah Terbukti naik dari nilai dasar'],['2029–2030','Perluasan ke 43 PLTU, menjadi syarat penerimaan biomassa']].map(a=>`<div class="tli"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div></div></div>
<div class="card"><div class="ch"><h3>Tanya jawab</h3></div>${[['Apakah aplikasi ini menghentikan co-firing?','Tidak. Green Linkage hanya memeriksa asal biomassa, bukan menghentikan program.'],['Siapa yang memutuskan status kuning?','Manusia, bukan mesin. Verifikator Muda memeriksa titik asal, lalu petugas PLN memutuskan beserta alasannya.'],['Siapa yang menindak status merah?','Kementerian Kehutanan. Berkas merah hanya diteruskan sebagai bahan penegakan.']].map(a=>`<details><summary>${a[0]}</summary><p class="mut">${a[1]}</p></details>`).join('')}</div>`};

const fv=()=>{const g=id=>$('#'+id);return{rid:g('rid').value,j:g('j').value,w:Math.max(0,+g('w').value||0),doc:g('doc').checked,pk:g('pk').checked,sup:g('sup').checked,ll:PK.ll}};
function upd(){const i=fv(),e=i.w?ev(i):{st:''};$('#pv').className='pv '+e.st;$('#pv').innerHTML=i.w?`<div class="row"><b class="grow">Prakiraan Gerbang</b>${B(e.st)}</div><div class="mut">ISM wilayah setelah kiriman ini: ${fmt(e.ism)}</div><ul>${e.rs.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<span class="mut">Isi berat kiriman untuk melihat prakiraan status.</span>';$('#dw').style.display=['kayu','pelet'].includes(i.j)?'flex':'none';$('#sw').style.display=i.pk?'flex':'none';$('#pl').innerHTML=PK.ll?`${I('pin',14)} Titik asal dari peta: <b>${PK.ll.join(', ')}</b>`:'Belum memilih titik di peta: koordinat otomatis dari ponsel (simulasi).'}
function setPick(a){const r=nearest(a);if(!r)return toast('Titik di luar radius pasokan kabupaten terdaftar');PK={rid:r.id,ll:a.map(x=>+x.toFixed(4))};$('#rid').value=r.id;mark();upd()}
function selR(){PK={rid:$('#rid').value};if(PKM){PKM.remove();PKM=null}MP.flyTo(reg(PK.rid).c,8,{duration:.6});upd()}
V.kirim=()=>{if(ROLE!='pem')return`<div class="ph"><h2>Green Linkage Asal</h2></div><div class="card"><p>Hanya Pemasok yang mencatat kiriman. Sebagai ${RL[ROLE][0]}, Anda bisa memantau hasilnya di Dasbor.</p><button class="btn" onclick="setRole('pem')">Ganti ke Pemasok</button></div>`;
const l=last&&S.ships.find(s=>s.id==last);return`<div class="ph"><h2>Green Linkage Asal</h2><p class="mut">Catat kiriman sebelum biomassa diterima. Deklarasi bisa dipalsukan, jadi setiap data diuji modul Neraca.</p></div>
${l?`<div class="pv ${eff(l)}" style="margin:0 0 14px"><div class="row"><b class="grow">${l.id} tercatat</b>${B(eff(l))}</div><ul>${l.rs.map(x=>`<li>${x}</li>`).join('')}</ul><div class="mut">Titik asal ${l.ll.join(', ')}</div></div>`:''}
<div class="two"><div class="card"><div class="step"><span>1</span>Pilih titik asal di peta</div><div class="mut">Ketuk pin kabupaten atau titik mana pun di dalam radius pasokan.</div><div class="mm tall" id="km"></div><div class="mut" id="pl"></div></div>
<div class="card"><div class="step"><span>2</span>Isi data kiriman</div>

<div class="kpi">${kpi('alert',bad+' dari '+R.length,'kabupaten melewati ambang','rd')}${kpi('scale',fmt(Math.max(...rows.map(x=>x.i))),'ISM tertinggi','am')}${kpi('chart',fmt(rows.reduce((a,x)=>a+x.i*x.r.pot,0)/R.reduce((a,r)=>a+r.pot,0)),'ISM gabungan 8 kabupaten')}</div>

${q.length?q.map(s=>`<div class="card" id="t${s.id}"><div class="ch"><div><h3>${s.id} · ${reg(s.rid).n}</h3><span class="mut">${J[s.j]}, ${s.w} ton, titik ${s.ll.join(', ')}</span></div>${B('kuning')}</div><ul>${s.rs.map(x=>`<li>${x}</li>`).join('')}</ul>

:ROLE=='ver'?`<label>Daftar periksa lapangan</label>${CK.map(c=>`<label class="ck"><input type="checkbox">${c}</label>`).join('')}<label>Catatan lapangan</label><textarea id="n${s.id}" rows="2" placeholder="Opsional"></textarea><br><br><button class="btn" onclick="fnd('${s.id}')">Kirim temuan (+10 poin)</button>`:'<div class="mut mt">Belum ada temuan lapangan.'+(pln?' Keputusan baru dapat diambil setelah Verifikator Muda mengirim temuan.':'')+'</div>'}</div>`).join(''):`<div class="card empty"><div class="ti">${I('check',22)}</div><b>Antrean kosong</b><div class="mut">Semua kiriman kuning sudah diputuskan. Catat kiriman baru untuk menambah antrean.</div></div>`}`};

function fnd(id){const n=$('#t'+id).querySelectorAll('input:checked').length,s=S.ships.find(x=>x.id==id);s.find={n,note:$('#n'+id).value.trim()};S.pts+=10;save();toast('Temuan terkirim, +10 poin');go('ver')}
function dec(id,v){const a=$('#a'+id).value.trim();if(!a)return toast('Alasan keputusan wajib diisi');const s=S.ships.find(x=>x.id==id);s.fin=v;s.why=a;save();toast(v=='merah'?'Ditahan, berkas siap diteruskan ke Kemenhut':'Dihijaukan, pembayaran berjalan');go('ver')}

/* ===================== DASBOR ===================== */
const byT=(f,k)=>S.ships.filter(s=>f(s)==k).reduce((o,s)=>(o[eff(s)]+=s.w,o),{hijau:0,kuning:0,merah:0});
V.dash=()=>{const t=T(),sh=S.ships,pot=R.reduce((x,r)=>x+r.pot,0),cl=R.reduce((x,r)=>x+klaim(r.id),0),dl=t.rl-S.base,over=R.filter(r=>klaim(r.id)/r.pot>1).length,q=pend(),L2=sh.filter(s=>flt=='all'||eff(s)==flt).slice().reverse(),red=sh.filter(s=>eff(s)=='merah'),pc=k=>fmt(t[k]/(t.all||1)*100,1)+'%';
return`<div class="ph"><h2>Dasbor PLN, EBTKE, dan Kemenhut</h2><p class="mut">Ringkasan status tonase, tren, dan alur pemeriksaan seluruh kiriman.</p></div>
<div class="three"><div class="card"><div class="ch"><h3>Rasio Limbah Terbukti</h3><span class="b ${dl>=0?'hijau':'merah'}">${dl>=0?'▲':'▼'} ${fmt(Math.abs(dl),1)} poin</span></div><div class="row wrap" style="gap:18px"><div class="donutw">${cv('cDn',170)}<div class="ctr"><div><b>${fmt(t.rl,1)}%</b><small>tonase hijau</small></div></div></div>
<div class="grow"><div class="leg">${['hijau','kuning','merah'].map(k=>`<div><span class="dot ${k}"></span>${LBL[k]}<b>${fmt(t[k],0)} t · ${pc(k)}</b></div>`).join('')}</div><p class="mut">Tonase hijau dibanding seluruh tonase yang dibakar. Nilai dasar ${fmt(S.base,1)}%, sasaran 2028 di atas nilai dasar.</p></div></div></div>
<div class="card"><div class="ch"><h3>Tren per kiriman</h3><span class="mut">kumulatif</span></div>${cv('cTr',230)}</div></div>
<div class="kpi">${kpi('box',fmt(t.all,0),'ton tercatat')}${kpi('leaf',fmt(t.hijau,0),'ton hijau','g2')}${kpi('alert',fmt(t.kuning,0),'ton kuning','am')}${kpi('flag',fmt(t.merah,0),'ton merah','rd')}${kpi('scale',fmt(cl/pot),'ISM gabungan')}${kpi('pin',over+' dari '+R.length,'kabupaten di atas 1','rd')}</div>
<div class="three"><div class="card"><div class="ch"><h3>Status tonase per kabupaten</h3></div>${cv('cKb',320)}</div>
<div class="card"><div class="ch"><h3>Status tonase per jenis biomassa</h3></div>${cv('cJn',320)}</div></div>
<div class="three"><div class="card"><div class="ch"><h3>Alur pemeriksaan</h3><span class="mut">${q.length} kiriman kuning masih menunggu</span></div>${cv('cFn',230)}</div>
<div class="card"><div class="ch"><h3>Rentang ISM per skenario 2030</h3></div>${cv('cRg2',230)}</div></div>
${ctx('cxd')}
<div class="card"><div class="ch"><h3>Berkas merah untuk Kementerian Kehutanan</h3><span class="mut">${red.length} berkas</span></div>${red.length?red.map(s=>`<div class="row mt"><span class="dot merah"></span><span class="grow">${s.id} · ${reg(s.rid).n} · ${s.w} ton</span>${s.fw?'<span class="b hijau">Terkirim</span>':ROLE=='pln'?`<button class="btn ghost" onclick="fw('${s.id}')">Teruskan</button>`:'<span class="mut">Menunggu PLN</span>'}</div>`).join(''):'<span class="mut">Belum ada berkas merah.</span>'}</div>
<div class="card"><div class="ch"><h3>Riwayat kiriman</h3></div><div class="chips">${[['all','Semua'],['hijau','Hijau'],['kuning','Kuning'],['merah','Merah']].map(a=>`<button class="chip ${flt==a[0]?'on':''}" onclick="flt='${a[0]}';go('dash')">${a[1]}</button>`).join('')}</div>
${L2.map(s=>`<details><summary><span class="grow">${s.id} · ${reg(s.rid).n} · ${s.w} ton</span>${B(eff(s))}</summary><div class="mut">${J[s.j]}, ISM ${fmt(s.ism)}, titik ${s.ll.join(', ')}</div><ul>${s.rs.map(x=>`<li>${x}</li>`).join('')}</ul>${s.find?`<div>Temuan lapangan: ${s.find.n}/4 sesuai</div>`:''}${s.why?`<div><b>Keputusan PLN:</b> ${s.why}</div>`:''}</details>`).join('')||'<span class="mut">Tidak ada data.</span>'}</div>
<div class="row wrap"><button class="btn ghost" onclick="cp(0)">${I('copy',16)}Salin ringkasan</button><button class="btn ghost" onclick="cp(1)">${I('copy',16)}Salin CSV</button><button class="btn ghost" onclick="if(confirm('Setel ulang semua data?')){try{localStorage.removeItem('gl2')}catch(e){}location.reload()}">Setel ulang</button></div>`};
AFT.dash=()=>{const t=T(),sh=S.ships,red=sh.filter(s=>eff(s)=='merah'),js=Object.keys(J).filter(k=>sh.some(s=>s.j==k));
chart('cDn',donutCfg(t));chart('cTr',trendCfg());
chart('cKb',stackCfg(R.map(r=>r.n),R.map(r=>byT(s=>s.rid,r.id))));
chart('cJn',stackCfg(js.map(k=>J[k]),js.map(k=>byT(s=>s.j,k))));
chart('cFn',funnelCfg([['Kiriman tercatat',sh.length],['Kuning awal',sh.filter(s=>s.st=='kuning').length],['Ada temuan lapangan',sh.filter(s=>s.find).length],['Diputuskan PLN',sh.filter(s=>s.fin).length],['Diteruskan ke Kemenhut',red.filter(s=>s.fw).length]]));
chart('cRg2',rngCfg());chart('cxd',ctxCfg())};
function fw(id){S.ships.find(x=>x.id==id).fw=1;save();toast('Berkas diteruskan ke Kementerian Kehutanan');go('dash')}
function cp(c){const t=T(),x=c?['id,kabupaten,jenis,ton,ism,status'].concat(S.ships.map(s=>[s.id,reg(s.rid).n,J[s.j],s.w,s.ism.toFixed(2),eff(s)].join(','))).join('\n'):`Green Linkage: ${fmt(t.all,0)} ton tercatat, Rasio Limbah Terbukti ${fmt(t.rl,1)}%, ${S.ships.filter(s=>eff(s)=='merah').length} berkas merah.`;try{navigator.clipboard.writeText(x).then(()=>toast('Tersalin'),()=>toast('Gagal menyalin'))}catch(e){toast('Gagal menyalin')}}

/* ===================== PERAN, TEMA, NAVIGASI ===================== */
function setRole(r){ROLE=S.role=r;save();if(!RL[r][3].includes(tab))tab=RL[r][3][0];toast(`Peran: ${RL[r][0]}. ${RL[r][2]}`);go(tab)}
function go(t){killCh();if(MP){MP.remove();MP=null}tab=t;const q=pend().length;
$('#th').innerHTML=I(isDark()?'sun':'moon',17);
$('#seg').innerHTML=Object.entries(RL).map(([k,v])=>`<button class="${k==ROLE?'on':''}" data-r="${k}" aria-pressed="${k==ROLE}" title="${v[0]}">${I(v[1],16)}<span class="lb">${v[0]}</span></button>`).join('');
$('#nav').innerHTML=RL[ROLE][3].map(k=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${I(NV[k][0],20)}<span>${k=='ver'&&ROLE=='pln'?'Keputusan':NV[k][1]}${k=='ver'&&q?` <em>${q}</em>`:''}</span></button>`).join('');
chDef();$('#m').innerHTML=V[t]();AFT[t]&&AFT[t]();scrollTo(0,0)}
$('#lg').innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="'+IC.leaf+'"/></svg>';
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setRole(b.dataset.r)});
$('#th').addEventListener('click',()=>{const d=document.documentElement;S.theme=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=S.theme;save();go(tab)});
document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
go('home');
</script></body></html>
